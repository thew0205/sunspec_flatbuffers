syntax = "proto3";

// package sunspec;

/* =======================
 * Enums
 * ======================= */

enum SunspecPointAccess {
  kR  = 0; // Read-only
  kRW = 1; // Read-write
}

enum SunspecPointMandatory {
  kM = 0; // Optional
  kO = 1; // Mandatory
}

enum SunspecGroupType {
  kGroup = 0;
  kSync  = 1;
}

/* =======================
 * Primitive wrapper messages
 * ======================= */

message Sint16  { int32  value = 1; }   // int16 stored in int32
message Sint32  { int32  value = 1; }
message Sint64  { int64  value = 1; }

message Uint16  { uint32 value = 1; }   // uint16 stored in uint32
message Uint32  { uint32 value = 1; }
message Uint64  { uint64 value = 1; }

message Raw16   { uint32 value = 1; }
message Acc16   { uint32 value = 1; }
message Acc32   { uint32 value = 1; }
message Acc64   { uint64 value = 1; }

message Bitfield16 { uint32 value = 1; }
message Bitfield32 { uint32 value = 1; }
message Bitfield64 { uint64 value = 1; }

message Enum16 { uint32 value = 1; }
message Enum32 { uint32 value = 1; }

message Float32 { float  value = 1; }
message Float64 { double value = 1; }

message Stringx { string value = 1; }

message SunsSf  { int32 value = 1; }   // scale factor (int16 → int32)

message Pad16   { uint32 value = 1; }

/* =======================
 * Address types
 * ======================= */

message IpAddr {
  uint32 octet1 = 1;
  uint32 octet2 = 2;
  uint32 octet3 = 3;
  uint32 octet4 = 4;
}

message Ipv6Addr {
  bytes value = 1; // exactly 16 bytes
}

message Eui48 {
  bytes value = 1; // exactly 6 bytes
}

/* =======================
 * Union → oneof
 * ======================= */

message SunspecPointData {
  oneof kind {
    Sint16      Sint16      = 1;
    Sint32      Sint32      = 2;
    Sint64      Sint64      = 3;
    Raw16       Raw16       = 4;
    Uint16      Uint16      = 5;
    Uint32      Uint32      = 6;
    Uint64      Uint64      = 7;
    Acc16       Acc16       = 8;
    Acc32       Acc32       = 9;
    Acc64       Acc64       = 10;
    Bitfield16  Bitfield16  = 11;
    Bitfield32  Bitfield32  = 12;
    Bitfield64  Bitfield64  = 13;
    Enum16      Enum16      = 14;
    Enum32      Enum32      = 15;
    Float32     Float32     = 16;
    Float64     Float64     = 17;
    Stringx     Stringx     = 18;
    SunsSf      SunsSf     = 19;
    Pad16       Pad16       = 20;
    IpAddr      IpAddr     = 21;
    Ipv6Addr    Ipv6Addr   = 22;
    Eui48       Eui48       = 23;
  }
}

/* =======================
 * Point definition
 * ======================= */

message SunspecPointDef {
  string id = 1;

  SunspecPointData data = 2;

  uint32 count = 3;                // default = 1
  string count_point_id = 4;

  uint32 size = 5;

  int32 sf = 6;                    // scale factor
  string sf_id = 7;

  string units = 8;

  SunspecPointAccess access = 9;
  SunspecPointMandatory mandatory = 10;

  string label = 11;
}

/* =======================
 * Group definition
 * ======================= */

message SunspecGroupDef {
  string id = 1;

  SunspecGroupType type = 2;

  uint32 count = 3;
  string count_point_id = 4;

  repeated SunspecPointDef points = 5;
  repeated SunspecGroupDef groups = 6;

  string label = 7;
}

/* =======================
 * Model definition
 * ======================= */

message SunspecModelDef {
  uint32 id = 1; // uint16 stored as uint32
  SunspecGroupDef group = 2;
}
